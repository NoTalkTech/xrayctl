name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]  # 监听版本标签
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Install golangci-lint
      run: |
        # Pin to v1.60.3: golangci-lint v1.60.0's release artifact was
        # removed upstream (the v1.60.0 tarball now 404s on GitHub
        # releases). v1.60.3 is the next patch on the same minor and
        # uses the same v1 config schema, so .golangci.yml is unchanged.
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.60.3

    - name: Run golangci-lint
      run: golangci-lint run --timeout 5m ./...

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint  # 依赖lint job成功

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Run go mod download
      run: go mod download

    - name: Run tests
      run: go test ./... -v -race -coverprofile=coverage.out

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.out
        retention-days: 7

  build:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    needs: test  # 依赖test job成功

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Run go mod download
      run: go mod download

    - name: Build for Linux
      run: |
        GOOS=linux GOARCH=amd64 go build -o xrayctl-linux-amd64 ./cmd
        GOOS=linux GOARCH=arm64 go build -o xrayctl-linux-arm64 ./cmd

    - name: Show binary info
      run: |
        ls -lh xrayctl-linux*
        file xrayctl-linux*

    - name: Upload Linux binaries
      uses: actions/upload-artifact@v4
      with:
        name: xrayctl-binaries
        path: |
          xrayctl-linux-amd64
          xrayctl-linux-arm64
        retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build  # 依赖build job成功
    if: startsWith(github.ref, 'refs/tags/v')  # 仅在tag时运行

    permissions:
      contents: write  # 需要写入权限创建release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史用于版本信息

    - name: Get version from tag
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Tag version: ${VERSION}"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Run go mod download
      run: go mod download

    - name: Build release binaries
      run: |
        # 构建Linux版本
        GOOS=linux GOARCH=amd64 go build -o xrayctl-linux-amd64 ./cmd
        GOOS=linux GOARCH=arm64 go build -o xrayctl-linux-arm64 ./cmd

        # 构建Windows版本
        GOOS=windows GOARCH=amd64 go build -o xrayctl-windows-amd64.exe ./cmd

        # 构建macOS版本
        GOOS=darwin GOARCH=amd64 go build -o xrayctl-darwin-amd64 ./cmd
        GOOS=darwin GOARCH=arm64 go build -o xrayctl-darwin-arm64 ./cmd

    - name: Create checksums
      run: |
        # 为所有二进制文件创建SHA256校验和
        for file in xrayctl-*; do
          if [ -f "$file" ]; then
            sha256sum "$file" > "${file}.sha256"
          fi
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        tag_name: ${{ github.ref_name }}
        body: |
          ## Xrayctl v${{ steps.get_version.outputs.VERSION }}

          ### Changes
          See the commit history for detailed changes.

          ### Downloads
          - **Linux amd64**: xrayctl-linux-amd64
          - **Linux arm64**: xrayctl-linux-arm64
          - **Windows amd64**: xrayctl-windows-amd64.exe
          - **macOS amd64**: xrayctl-darwin-amd64
          - **macOS arm64**: xrayctl-darwin-arm64

          ### SHA256 Checksums
          See attached .sha256 files for verification.
        draft: false
        prerelease: false
        files: |
          xrayctl-linux-amd64
          xrayctl-linux-amd64.sha256
          xrayctl-linux-arm64
          xrayctl-linux-arm64.sha256
          xrayctl-windows-amd64.exe
          xrayctl-windows-amd64.exe.sha256
          xrayctl-darwin-amd64
          xrayctl-darwin-amd64.sha256
          xrayctl-darwin-arm64
          xrayctl-darwin-arm64.sha256